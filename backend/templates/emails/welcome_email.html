<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        .card {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 10px;
        }

        .title {
            color: #2563eb;
        }
    </style>
</head>
<body>

<div class="card">

    <h2 class="title">Welcome to HavEnsure</h2>

    <p>Hello {{ name }},</p>

    <p>Your account has been created successfully.</p>

    <h3>Login Details</h3>

    <p>
        <strong>Email:</strong> {{ email }}
    </p>

    <p>
        <strong>Password:</strong> {{ password }}
    </p>

    <hr>

    <p>
        Please change your password after your first login.
    </p>

</div>

</body>
</html>
